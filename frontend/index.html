<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M10 7v10a3 3 0 0 0 3 3M22 7v10a3 3 0 0 1-3 3M16 20v5' stroke='%2322d3ee' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>GripSense AI</title>
    <script>
      try {
        var p = (JSON.parse(localStorage.getItem('gripsense.settings.v1') || '{}').theme) || 'system';
        var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
